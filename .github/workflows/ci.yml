name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check web/app.js

      - name: Run catalog tests
        run: node --test web/tests/*.test.mjs

  ios:
    name: iOS tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run iOS tests
        run: >-
          xcodebuild test
          -project ios/HomeLibrary.xcodeproj
          -scheme HomeLibrary
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
